[project]
name = "kapso-whatsapp-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Lo que se empaqueta en Lambda: src/requirements.txt sale de aquí vía
# `make lock-requirements`, así que todo lo que se añada engorda el bundle.
dependencies = [
    "aws-lambda-powertools>=3.7.0",
    "aws-xray-sdk>=2.14.0",
    "httpx>=0.28.0",
    "langchain-aws>=1.6.3",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-aws>=1.2.0",
    "pydantic>=2.0",
]

[dependency-groups]
# Lo que instala el CI: lint y tests.
dev = [
    "aws-lambda-typing>=2.20.0",
    "boto3>=1.43.53",
    "pytest>=8.0",
    "respx>=0.22.0",
    "ruff==0.16.0",
]
# Solo para levantar el bot en local; nunca llega a Lambda.
local = [
    "fastapi[standard]>=0.139.2",
    "python-dotenv>=1.2.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Artefactos de build de SAM: son dependencias vendorizadas, no código nuestro.
extend-exclude = ["infra/.aws-sam", ".venv"]

[tool.ruff.lint]
# Conjunto explícito de reglas: sin esto ruff usa su set por defecto y los
# resultados del CI cambian con cada release nueva de ruff.
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
# Compatible con `ruff format` (estilo Black): evita falsos positivos en slices.
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Script one-off de generación de dataset: prints, open() sin context manager
# y bucles largos son aceptables aquí.
"tools/*" = ["SIM115", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
