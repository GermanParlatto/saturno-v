AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bot de WhatsApp — Kapso + AWS + LangGraph

Parameters:
  # MinLength: 1 en los secretos. Sin esto, un secret vacío (p. ej. no
  # configurado en GitHub) se desplegaría sin error y el bot rechazaría
  # todos los webhooks con 401.
  KapsoApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
  KapsoWebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 1
  ModelId:
    Type: String
    Default: eu.amazon.nova-2-lite-v1:0
    Description: Inference profile (OJO, no el ID base del modelo)
  LangsmithApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: API key de LangSmith para trazas del grafo (solo worker)
  SpokyEndpointUrl:
    Type: String
    MinLength: 1
    Description: URL completa del endpoint de Spoky (incluye /v1/chat/completions)
  SpokyApiToken:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Token de Hugging Face para el endpoint de Spoky
  CourseId:
    Type: String
    Default: waku-l0
    # Tampoco es un secreto. Sale al FLOW#<curso> de CourseCatalogTable: el mismo
    # valor que usa tools/seed-course.py --course al sembrar la secuencia.
    Description: Identificador del curso que sirve el motor (una sola instancia por stack)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        # Sin esto, Powertools filtra a WARNING y los logger.info NO aparecen.
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: kapso-bot
        POWERTOOLS_METRICS_NAMESPACE: kapso-bot

Resources:
  # ------- colas -----------------------------------------------------------
  IncomingQueue:
    Type: AWS::SQS::Queue
    Properties:
      # REGLA: mayor que el Timeout del worker (si no, un mensaje reaparece
      # mientras todavía se está procesando y se duplica el trabajo).
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IncomingDLQ.Arn
        maxReceiveCount: 3

  IncomingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 días para inspeccionar los fallos

  # ------- tablas ---------------------------------------------------------------
  # Idempotencia: una clave por evento de Kapso.
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---- motor de curso ----------------------------------------------------
  # Definición del curso: estática (~70 nodos), se cachea en RAM por contenedor.
  # PK/SK: NODE#<id>/META  y  FLOW#<curso>/ORD#<n>.  Sin TTL (no caduca).
  CourseCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # Estado por alumno: PK = USER#<tel>, SK = STATE.  SIN TTL a propósito: el progreso
  # debe durar meses; un TTL corto heredado de una caché de conversación lo borraría.
  # SSE on: guarda datos de contacto de tutores de menores.
  CourseStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ---- receptor ---------------------------------------------------------------
  ReceiverFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src
      Handler: receiver.handler.handler
      Timeout: 15 # el webhook debe responder en < 10 s
      MemorySize: 256
      Environment:
        Variables:
          KAPSO_WEBHOOK_SECRET: !Ref KapsoWebhookSecret
          QUEUE_URL: !Ref IncomingQueue
          TABLE_NAME: !Ref StateTable
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IncomingQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: post

  # ---- worker ---------------------------------------------------------------
  WorkerFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src
      Handler: worker.handler.handler
      Timeout: 120 # el grafo puede tardar: < VisibilityTimeout de la cola
      MemorySize: 1024 # LangGraph pesa; más memoria = también más CPU
      Environment:
        Variables:
          KAPSO_API_KEY: !Ref KapsoApiKey
          MODEL_ID: !Ref ModelId
          # Voz de Spoky (shared/voice.py). Los parámetros existían desde la fase del
          # finalizador pero no se cableaban a ninguna función: sin ellos, cada mensaje
          # lanza SpokyConfigError y el curso sale con el borrador, sin personaje.
          SPOKY_ENDPOINT_URL: !Ref SpokyEndpointUrl
          SPOKY_API_TOKEN: !Ref SpokyApiToken
          # Motor de curso: course/catalog.py y course/repository.py leen estas tres.
          # Sin ellas el worker revienta con KeyError en la primera invocación.
          CATALOG_TABLE: !Ref CourseCatalogTable
          COURSE_STATE_TABLE: !Ref CourseStateTable
          COURSE_ID: !Ref CourseId
          # El motor se auto-encola la continuación cuando una cadena de nodos supera
          # MAX_NODES_PER_INVOCATION, en vez de agotar el Timeout de 120s.
          QUEUE_URL: !Ref IncomingQueue
          # Ráfaga: entre E1-01 y E1-08 hay 7 nodos pauses=false seguidos. Sin pausa
          # llegarían 7 vídeos y cómics en menos de un segundo.
          INTER_MESSAGE_DELAY_MS: "1500"
          MAX_NODES_PER_INVOCATION: "10"
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: !Ref LangsmithApiKey
          LANGSMITH_PROJECT: spoky-bot
          # Tenant EU de LangSmith (no la nube pública por defecto).
          LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
        # Catálogo del curso: solo lectura (el worker nunca lo escribe).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
              Resource: !GetAtt CourseCatalogTable.Arn
        # Estado del alumno: lectura y escritura condicional (avance de posición).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt CourseStateTable.Arn
        # El worker se re-encola a sí mismo la continuación de una cadena larga.
        - SQSSendMessagePolicy:
            QueueName: !GetAtt IncomingQueue.QueueName
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt IncomingQueue.Arn
            # 3, no 10: el handler procesa el lote en SERIE, y ahora cada
            # mensaje puede sumar una llamada al endpoint de Spoky (que puede
            # arrancar en frío, 30-60s). Con BatchSize=10 un lote entero contra
            # un endpoint frío agotaría el Timeout de 120s del worker y volvería
            # a la cola completo. Con MaximumConcurrency=5 no se pierde
            # rendimiento real: salen más invocaciones, más pequeñas.
            BatchSize: 3
            # Permite devolver batchItemFailures y reintentar sólo lo que falló.
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # Palanca de escalado: limita cuántos workers tiran a la vez para no
            # saturar Bedrock ni los límites de envío de Meta.
            ScalingConfig:
              MaximumConcurrency: 5

Outputs:
  WebhookUrl:
    Description: URL a registrar en el webhook de Kapso
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  QueueUrl:
    Value: !Ref IncomingQueue
  DLQUrl:
    Value: !Ref IncomingDLQ
