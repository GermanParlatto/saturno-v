name: deploy

# Se dispara al terminar "ci", no en el push: si el CI falla, no hay deploy.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write # OIDC: nada de claves AWS de larga duración
  contents: read

# Dos deploys a la vez: CloudFormation rechaza el segundo (UPDATE_IN_PROGRESS).
# Sin cancel-in-progress, que abortaría un sam deploy a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: eu-west-1
  STACK_NAME: kapso-whatsapp-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Solo main. workflow_dispatch tampoco exime de comprobar la rama: sin eso
    # cualquiera con permiso de escritura desplegaría una rama sin pasar el CI.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # Aporta los required reviewers y los secrets del despliegue.
    environment: production
    steps:
      # workflow_run checkea la rama por defecto, NO el commit que probó el CI:
      # sin fijar el SHA se desplegaría otra cosa.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Un secret inexistente se expande a "" y CloudFormation lo aceptaría: el
      # bot devolvería 401 a todo Kapso con el deploy en verde. Antes del rol.
      - name: Verificar que los secrets existen
        run: |
          missing=0
          for var in KAPSO_API_KEY KAPSO_WEBHOOK_SECRET LANGSMITH_API_KEY SPOKY_ENDPOINT_URL SPOKY_API_TOKEN AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!var}" ]; then
              echo "::error::Falta el secret $var en el entorno 'production'"
              missing=1
            fi
          done
          exit $missing
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SPOKY_ENDPOINT_URL: ${{ secrets.SPOKY_ENDPOINT_URL }}
          SPOKY_API_TOKEN: ${{ secrets.SPOKY_API_TOKEN }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Redundante bajo workflow_run (el CI ya lo validó), pero workflow_dispatch
      # no pasa por el CI y empaquetaría deps que no son las del lock.
      - name: Comprobar que src/requirements.txt está al día
        run: make check-requirements

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Credenciales AWS vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # rol IAM con confianza OIDC
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sam build
        run: sam build --template infra/template.yaml

      # Sin --config-file: samconfig.toml fija profile = "personal-dev", que no
      # existe en el runner (las credenciales vienen de OIDC).
      - name: sam deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags "git-sha=$DEPLOY_SHA" "managed-by=github-actions" \
            --parameter-overrides \
              KapsoApiKey="$KAPSO_API_KEY" \
              KapsoWebhookSecret="$KAPSO_WEBHOOK_SECRET" \
              LangsmithApiKey="$LANGSMITH_API_KEY" \
              SpokyEndpointUrl="$SPOKY_ENDPOINT_URL" \
              SpokyApiToken="$SPOKY_API_TOKEN"
        env:
          # GITHUB_SHA apunta a la rama por defecto: el mismo SHA del checkout.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          SPOKY_ENDPOINT_URL: ${{ secrets.SPOKY_ENDPOINT_URL }}
          SPOKY_API_TOKEN: ${{ secrets.SPOKY_API_TOKEN }}

      - name: Outputs del stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table
