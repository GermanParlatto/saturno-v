name: ci

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: el CI nunca escribe en el repo ni asume roles de AWS.
permissions:
  contents: read

# Si un PR recibe varios pushes seguidos, cancela las ejecuciones viejas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: eu-west-1

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked falla si el lock no está al día con pyproject.toml, en vez de
      # re-resolver por detrás (eso sería --frozen).
      - name: Instalar dependencias desde el lock
        run: uv sync --locked --group dev

      - name: ruff check
        run: uv run ruff check src tools tests

      - name: ruff format --check
        run: uv run ruff format --check src tools tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias desde el lock
        run: uv sync --locked --group dev

      - name: pytest
        run: uv run pytest -q

  sam:
    name: Validar y construir plantilla SAM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Si alguien tocó pyproject.toml sin regenerar, sam build empaquetaría
      # versiones distintas de las declaradas.
      - name: Comprobar que src/requirements.txt está al día
        run: make check-requirements

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # --lint añade las reglas de cfn-lint al parseo propio de SAM.
      - name: sam validate
        run: sam validate --template infra/template.yaml --lint --region ${{ env.AWS_REGION }}

      # Detecta errores de CodeUri/Handler y de resolución de deps que
      # `validate` no ve. No despliega ni necesita credenciales.
      - name: sam build
        run: sam build --template infra/template.yaml
